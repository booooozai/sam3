# @package _global_
defaults:
  - _self_

# ============================================================================
# SHORT SMOKE RUN of coco2017_steersam_mask.yaml (32 train/32 val pairs, 1 epoch,
# /tmp log dir) for GPU sanity checks; not a real experiment config.
# ============================================================================
# SteerSAM patch-supervision smoke config (steersam_design.md sections 7.10 and 9).
#
# Differences from coco2017_full_ft_mask_frozen_backbone.yaml:
# - model.enable_steering: true -> SteerableViT/SteerSAM* classes, text-first
#   positive-pair forward with zero-gated cross-attention adapters at ViT
#   blocks 7/15/23/31.
# - Strategy 2 freezes the pretrained ViT trunk, full language backbone, and
#   post-FPN SAM3 task stack. The builder re-enables steering adapters, while
#   the FPN and patch head stay trainable as the conditioned visual front end.
# - Optimizer param groups only cover trainable params (the trainer passes a
#   trainable-only allowlist for steering models), so the frozen backbones'
#   zero-LR groups are REMOVED and the adapters get their own lr group.
#   A weight-decay-0 rule covers the tanh(alpha) gates.
# ============================================================================
paths:
  coco_root: /home/chenshengbo/workspace/sam3/data/coco
  experiment_log_dir: /tmp/steersam_strategy2_b16_smoke_20260925
  bpe_path: /home/chenshengbo/workspace/sam3/sam3/assets/bpe_simple_vocab_16e6.txt.gz
  checkpoint_path: /home/chenshengbo/workspace/sam3/pretrained_weights/sam3/sam3.pt
# COCO 2017 dataset configuration
coco_train:
  # Smoke test: enough pairs to exercise several optimizer steps on 2 GPUs.
  num_images: 32

  # Training transforms pipeline
  train_transforms:
    - _target_: sam3.train.transforms.basic_for_api.ComposeAPI
      transforms:
        - _target_: sam3.train.transforms.filter_query_transforms.FlexibleFilterFindGetQueries
          query_filter:
            _target_: sam3.train.transforms.filter_query_transforms.FilterCrowds
        - _target_: sam3.train.transforms.point_sampling.RandomizeInputBbox
          box_noise_std: 0.1
          box_noise_max: 20
        - _target_: sam3.train.transforms.segmentation.DecodeRle
        - _target_: sam3.train.transforms.basic_for_api.RandomResizeAPI
          sizes:
            _target_: sam3.train.transforms.basic.get_random_resize_scales
            size: ${scratch.resolution}
            min_size: 480
            rounded: false
          max_size:
            _target_: sam3.train.transforms.basic.get_random_resize_max_size
            size: ${scratch.resolution}
          square: true
          consistent_transform: ${scratch.consistent_transform}
        - _target_: sam3.train.transforms.basic_for_api.PadToSizeAPI
          size: ${scratch.resolution}
          consistent_transform: ${scratch.consistent_transform}
        - _target_: sam3.train.transforms.basic_for_api.ToTensorAPI
        - _target_: sam3.train.transforms.filter_query_transforms.FlexibleFilterFindGetQueries
          query_filter:
            _target_: sam3.train.transforms.filter_query_transforms.FilterEmptyTargets
        - _target_: sam3.train.transforms.basic_for_api.NormalizeAPI
          mean: ${scratch.train_norm_mean}
          std: ${scratch.train_norm_std}
        - _target_: sam3.train.transforms.filter_query_transforms.FlexibleFilterFindGetQueries
          query_filter:
            _target_: sam3.train.transforms.filter_query_transforms.FilterEmptyTargets
    - _target_: sam3.train.transforms.filter_query_transforms.FlexibleFilterFindGetQueries
      query_filter:
        _target_: sam3.train.transforms.filter_query_transforms.FilterFindQueriesWithTooManyOut
        max_num_objects: ${scratch.max_ann_per_img}

  # Validation transforms pipeline
  val_transforms:
    - _target_: sam3.train.transforms.basic_for_api.ComposeAPI
      transforms:
        - _target_: sam3.train.transforms.segmentation.DecodeRle
        - _target_: sam3.train.transforms.basic_for_api.RandomResizeAPI
          sizes: ${scratch.resolution}
          max_size:
            _target_: sam3.train.transforms.basic.get_random_resize_max_size
            size: ${scratch.resolution}
          square: true
          consistent_transform: False
        - _target_: sam3.train.transforms.basic_for_api.ToTensorAPI
        - _target_: sam3.train.transforms.basic_for_api.NormalizeAPI
          mean: ${scratch.train_norm_mean}
          std: ${scratch.train_norm_std}

  # Joint box, classification, instance-mask, and semantic-mask losses.
  loss:
    _target_: sam3.train.loss.sam3_loss.Sam3LossWrapper
    matcher: ${scratch.matcher}
    o2m_weight: 2.0
    o2m_matcher:
      _target_: sam3.train.matcher.BinaryOneToManyMatcher
      alpha: 0.3
      threshold: 0.4
      topk: 4
    use_o2m_matcher_on_o2m_aux: false # Another option is true
    loss_fns_find:
      - _target_: sam3.train.loss.loss_fns.Boxes
        weight_dict:
          loss_bbox: 5.0
          loss_giou: 2.0
      - _target_: sam3.train.loss.loss_fns.IABCEMdetr
        weak_loss: False
        weight_dict:
          loss_ce: 20.0 # Another option is 100.0
          presence_loss: 20.0
        pos_weight: 10.0 # Another option is 5.0
        alpha: 0.25
        gamma: 2
        use_presence: True # Change
        pos_focal: false
        pad_n_queries: 200
        pad_scale_pos: 1.0
      - _target_: sam3.train.loss.loss_fns.Masks
        focal_alpha: 0.25
        focal_gamma: 2.0
        weight_dict:
          loss_mask: 200.0
          loss_dice: 10.0
        compute_aux: false

    loss_fn_semantic_seg:
      _target_: sam3.train.loss.loss_fns.SemanticSegCriterion
      presence_head: true
      presence_loss: false
      focal: true
      focal_alpha: 0.6
      focal_gamma: 2.0
      downsample: false
      weight_dict:
        loss_semantic_seg: 20.0
        loss_semantic_presence: 1.0
        loss_semantic_dice: 30.0
    scale_by_find_batch_size: ${scratch.scale_by_find_batch_size}

# ============================================================================
# Different helper parameters and functions
# ============================================================================
scratch:
  enable_segmentation: true
  # Model parameters
  d_model: 256
  pos_embed:
    _target_: sam3.model.position_encoding.PositionEmbeddingSine
    num_pos_feats: ${scratch.d_model}
    normalize: true
    scale: null
    temperature: 10000

  # Box processing
  use_presence_eval: True
  original_box_postprocessor:
    _target_: sam3.eval.postprocessors.PostProcessImage
    max_dets_per_img: -1 # infinite detections
    use_original_ids: true
    use_original_sizes_box: true
    use_presence: ${scratch.use_presence_eval}

  original_mask_postprocessor:
    _target_: sam3.eval.postprocessors.PostProcessImage
    max_dets_per_img: -1
    iou_type: "segm"
    use_original_ids: true
    use_original_sizes_box: true
    use_original_sizes_mask: true
    convert_mask_to_rle: true
    use_presence: ${scratch.use_presence_eval}

  # Matcher configuration
  matcher:
    _target_: sam3.train.matcher.BinaryHungarianMatcherV2
    focal: true # with `focal: true` it is equivalent to BinaryFocalHungarianMatcher
    cost_class: 2.0
    cost_bbox: 5.0
    cost_giou: 2.0
    alpha: 0.25
    gamma: 2
    stable: False
  scale_by_find_batch_size: True

  # Image processing parameters
  resolution: 672
  consistent_transform: False
  max_ann_per_img: 200

  # Normalization parameters
  train_norm_mean: [0.5, 0.5, 0.5]
  train_norm_std: [0.5, 0.5, 0.5]
  val_norm_mean: [0.5, 0.5, 0.5]
  val_norm_std: [0.5, 0.5, 0.5]

  # Training parameters
  num_train_workers: 10
  num_val_workers: 10
  max_data_epochs: 20
  target_epoch_size: 1500
  hybrid_repeats: 1
  context_length: 2
  gather_pred_via_filesys: false

  # Learning rate and scheduler parameters.
  # The pretrained FPN uses a conservative fine-tuning learning rate.
  lr_scale: 0.01
  lr_fpn: ${times:8e-4,${scratch.lr_scale}}
  # The steering adapters start from random init, so they need a higher LR
  # than the pretrained heads. SteerViT used 3e-4; 1e-4 with the shared
  # warmup/cooldown is the ablation starting point (steersam_design.md 7.9).
  lr_steer_adapter: 1e-4
  wd: 0.1
  scheduler_timescale: 20
  scheduler_warmup: 20
  scheduler_cooldown: 20

  # Steering adapter settings (mirrored in model params below).
  steering_layers: [7, 15, 23, 31]
  enable_patch_supervision: true
  patch_loss_weight: 0.1

# NOTE: steering inside the vision trunk requires re-measuring peak memory
# before raising batch size. Keep accumulation=1 with the standard collator;
# gradient accumulation requires a collator returning micro-batch lists.
  val_batch_size: 16
  collate_fn_val:
    _target_: sam3.train.data.collator.collate_fn_api
    _partial_: true
    repeats: ${scratch.hybrid_repeats}
    dict_key: coco2017
    with_seg_masks: ${scratch.enable_segmentation} # Note: Set this to true if using segmentation masks!

  gradient_accumulation_steps: 1
  train_batch_size: 16
  collate_fn:
    _target_: sam3.train.data.collator.collate_fn_api
    _partial_: true
    repeats: ${scratch.hybrid_repeats}
    dict_key: all
    with_seg_masks: ${scratch.enable_segmentation} # Note: Set this to true if using segmentation masks!

# ============================================================================
# Trainer Configuration
# ============================================================================

trainer:
  _target_: sam3.train.trainer.Trainer
  skip_saving_ckpts: false
  empty_gpu_mem_cache_after_eval: True
  skip_first_val: True
  max_epochs: 1
  accelerator: cuda
  seed_value: 123
  val_epoch_freq: 1
  mode: train
  gradient_accumulation_steps: ${scratch.gradient_accumulation_steps}

  distributed:
    backend: nccl
    find_unused_parameters: True
    gradient_as_bucket_view: True

  loss:
    all:
      _target_: sam3.train.loss.steersam_patch_loss.SteerSAMPatchLossWrapper
      task_loss: ${coco_train.loss}
      patch_loss_weight: ${scratch.patch_loss_weight}
    default:
      _target_: sam3.train.loss.steersam_patch_loss.SteerSAMPatchLossWrapper
      task_loss: null
      patch_loss_weight: ${scratch.patch_loss_weight}

  data:
    train:
      _target_: sam3.train.data.torch_dataset.TorchDataset
      dataset:
        _target_: sam3.train.data.sam3_image_dataset.Sam3ImageDataset
        limit_ids: ${coco_train.num_images}
        coco_json_loader:
          _target_: sam3.train.data.coco_json_loaders.COCOPositivePairFromJSON
          _partial_: true
        transforms: ${coco_train.train_transforms}
        load_segmentation: ${scratch.enable_segmentation}
        max_ann_per_img: 500000
        multiplier: 1
        max_train_queries: 50000
        max_val_queries: 50000
        training: true
        use_caching: False
        img_folder: ${paths.coco_root}/train2017
        ann_file: ${paths.coco_root}/annotations/instances_train2017.json

      shuffle: True
      batch_size: ${scratch.train_batch_size}
      num_workers: ${scratch.num_train_workers}
      pin_memory: True
      drop_last: True
      collate_fn: ${scratch.collate_fn}

    val:
      _target_: sam3.train.data.torch_dataset.TorchDataset
      dataset:
        _target_: sam3.train.data.sam3_image_dataset.Sam3ImageDataset
        # Smoke validation is deliberately a 32-positive-pair plumbing
        # check. It is not a complete all-category COCO AP evaluation.
        limit_ids: 32
        load_segmentation: ${scratch.enable_segmentation}
        coco_json_loader:
          _target_: sam3.train.data.coco_json_loaders.COCOPositivePairFromJSON
          _partial_: true
        img_folder: ${paths.coco_root}/val2017
        ann_file: ${paths.coco_root}/annotations/instances_val2017.json
        transforms: ${coco_train.val_transforms}
        max_ann_per_img: 100000
        multiplier: 1
        training: false

      shuffle: False
      batch_size: ${scratch.val_batch_size}
      num_workers: ${scratch.num_val_workers}
      pin_memory: True
      drop_last: False
      collate_fn: ${scratch.collate_fn_val}

  model:
    _target_: sam3.model_builder.build_sam3_image_model
    bpe_path: ${paths.bpe_path}
    checkpoint_path: ${paths.checkpoint_path}
    load_from_HF: false
    device: cpus
    eval_mode: false
    resolution: ${scratch.resolution}
    enable_segmentation: ${scratch.enable_segmentation} # Warning: Enable this if using segmentation.
    # Strategy 2: train only adapters, patch head, and FPN. The pretrained
    # ViT/text towers and the complete post-FPN SAM3 task stack are fixed.
    enable_steering: true
    steering_layers: ${scratch.steering_layers}
    steering_num_heads: 16
    steering_head_dim: 64
    steering_dropout: 0.0
    steering_factor: 1.0
    enable_patch_supervision: ${scratch.enable_patch_supervision}
    patch_head_zero_init: true
    frozen_pretrained_eval: true
    freeze_vision_backbone: true
    freeze_vision_fpn: false
    freeze_language_backbone: true
    freeze_sam3_task_modules: true

  meters:
    val:
      # A truncated positive-only subset cannot produce standard COCO AP.
      # Keep the val loop for forward/loss plumbing, but do not dump or score it.
      coco2017: null

  optim:
    amp:
      enabled: True
      amp_dtype: bfloat16

    optimizer:
      _target_: torch.optim.AdamW

    gradient_clip:
      _target_: sam3.train.optim.optimizer.GradientClipper
      max_norm: 0.1
      norm_type: 2

    # The trainer passes a trainable-only param allowlist for steering models,
    # so the frozen backbones' zero-LR groups from the baseline config are
    # intentionally absent here: they would match no trainable parameter.
    param_group_modifiers: []

    options:
      lr:
        - scheduler: # trainable FPN (all post-FPN SAM3 task modules are frozen)
            _target_: sam3.train.optim.schedulers.InverseSquareRootParamScheduler
            base_lr: ${scratch.lr_fpn}
            timescale: ${scratch.scheduler_timescale}
            warmup_steps: ${scratch.scheduler_warmup}
            cooldown_steps: ${scratch.scheduler_cooldown}
        - scheduler: # steering adapters, gates, and pre-FPN patch head
            _target_: sam3.train.optim.schedulers.InverseSquareRootParamScheduler
            base_lr: ${scratch.lr_steer_adapter}
            timescale: ${scratch.scheduler_timescale}
            warmup_steps: ${scratch.scheduler_warmup}
            cooldown_steps: ${scratch.scheduler_cooldown}
          param_names:
            - "*steering_adapters*"
            - "*steering_patch_head*"

      weight_decay:
        - scheduler:
            _target_: fvcore.common.param_scheduler.ConstantParamScheduler
            value: ${scratch.wd}
        - scheduler:
            _target_: fvcore.common.param_scheduler.ConstantParamScheduler
            value: 0.0
          param_names:
            - "*bias*"
          module_cls_names: ["torch.nn.LayerNorm"]
        - scheduler: # never decay the zero-initialized gates toward zero output
            _target_: fvcore.common.param_scheduler.ConstantParamScheduler
            value: 0.0
          param_names:
            - "*steering_adapters*.alpha"

  checkpoint:
    save_dir: ${launcher.experiment_log_dir}/checkpoints
    save_freq: 1 # 0 only last checkpoint is saved.

  logging:
    tensorboard_writer:
      _target_: sam3.train.utils.logger.make_tensorboard_logger
      log_dir: ${launcher.experiment_log_dir}/tensorboard
      flush_secs: 120
      should_log: True
    wandb_writer: null
    log_dir: ${launcher.experiment_log_dir}/logs/coco2017_mask
    log_freq: 10

# ============================================================================
# Launcher and Submitit Configuration
# ============================================================================

launcher:
  num_nodes: 1
  gpus_per_node: 2
  experiment_log_dir: ${paths.experiment_log_dir}
  multiprocessing_context: forkserver

submitit:
  account: null
  partition: null
  qos: null
  timeout_hour: 72
  use_cluster: False
  cpus_per_task: 10
  port_range: [10000, 65000]
  constraint: null
